name: CI

on:
  push:
    branches: [master, main, rust]
    tags: ["v*"]
  pull_request:
    branches: [master, main, rust]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  clippy:
    # Lint findings are reported but do not block builds or releases.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libx11-dev libxext-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets

  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: assdraw-rs-linux-x86_64
            bin: assdraw-rs
          - os: windows-latest
            artifact: assdraw-rs-windows-x86_64
            bin: assdraw-rs.exe
          - os: macos-latest
            artifact: assdraw-rs-macos-arm64
            bin: assdraw-rs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libx11-dev libxext-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" dist/
          cp README.md LICENSE dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    # Attach the three builds to a GitHub Release when a tag like v0.3.1 is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
