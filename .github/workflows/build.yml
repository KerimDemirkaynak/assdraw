name: Build ASSDraw3

on:
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Bu parametre sayesinde Actions sekmesinden manuel tetikleyebilirsin.

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwxgtk3.2-dev ninja-build xvfb
    - name: Configure
      run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
    - name: Build editor and tests
      run: cmake --build build-linux --parallel 2
    - name: Package Linux build
      run: |
        install -Dm755 build-linux/assdraw3 package/ASSDraw3-Linux-x64/assdraw3
        cp LICENSE NOTICE.md README.md README.tr.md package/ASSDraw3-Linux-x64/
        tar -C package -czf ASSDraw3-Linux-x64.tar.gz ASSDraw3-Linux-x64
    - name: Upload Linux build
      uses: actions/upload-artifact@v4
      with:
        name: ASSDraw3-Linux-x64
        path: ASSDraw3-Linux-x64.tar.gz
        if-no-files-found: error
    - name: Run regression tests
      run: ctest --test-dir build-linux --output-on-failure

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Ensure AGG Submodule Exists (Fallback Clone)
      run: |
        if (-not (Test-Path "vendor/agg/agg-src/include/agg_basics.h")) {
            Write-Host "Alt modul eksik! Git submodules atlanarak manuel klonlaniyor..."
            if (Test-Path "vendor/agg") { Remove-Item -Recurse -Force "vendor/agg" }
            git clone https://github.com/ghaerr/agg-2.6.git vendor/agg
            Set-Location vendor/agg
            git checkout c4f36b4432142f22c0bf82c6fbdb41567a236be2
            Set-Location ../..
        }
      shell: pwsh

    - name: Cache vcpkg archives
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\vcpkg\archives
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Set VCPKG_ROOT
      run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Build with PowerShell helper
      run: .\build\build-win-vcpkg.ps1 -Fresh
      shell: pwsh

    - name: Package Windows build
      run: |
        $package = 'package\ASSDraw3-Windows-x64'
        New-Item -ItemType Directory -Path $package -Force | Out-Null
        Copy-Item 'build-dir\Release\assdraw3.exe' $package
        Get-ChildItem 'build-dir\Release' -Filter '*.dll' | Copy-Item -Destination $package
        Copy-Item 'docs\ASSDraw3.chm', 'LICENSE', 'NOTICE.md', 'README.md', 'README.tr.md' $package
        if (Test-Path 'build-dir\Release\locale') {
          Copy-Item 'build-dir\Release\locale' $package -Recurse
        }
        Compress-Archive -Path "$package\*" -DestinationPath 'ASSDraw3-Windows-x64.zip' -Force
      shell: pwsh

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: ASSDraw3-Windows-x64
        path: ASSDraw3-Windows-x64.zip
        if-no-files-found: error

    - name: Build and run regression tests
      run: |
        cmake --build build-dir --config Release --target assdraw-core-tests assdraw-gui-tests --parallel
        ctest --test-dir build-dir -C Release --output-on-failure
      shell: pwsh

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
      shell: pwsh

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: ASSDraw3-Windows-Setup
        path: installer\ASSDraw3_Setup.exe
        if-no-files-found: error
