name: Build ASSDraw3

on:
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      windows_package:
        description: Windows download format
        type: choice
        default: both
        options:
          - both
          - inno-setup
          - portable
      sign_windows:
        description: Sign Windows packages with SignPath (requires project approval and credentials)
        type: boolean
        default: false
      scan_download_run_id:
        description: Scan Windows downloads from this earlier run without executing them (leave empty to build)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.scan_download_run_id == ''
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev pkg-config ninja-build xvfb gettext
    - name: Configure
      run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
    - name: Build editor and tests
      run: cmake --build build-linux --parallel 2
    - name: Package Linux build
      run: |
        cmake --install build-linux --prefix package/ASSDraw3-Linux-x64
        python3 tools/translations.py --check-package package/ASSDraw3-Linux-x64
        tar -C package -czf ASSDraw3-Linux-x64.tar.gz ASSDraw3-Linux-x64
    - name: Upload Linux build
      uses: actions/upload-artifact@v7
      with:
        path: ASSDraw3-Linux-x64.tar.gz
        archive: false
        if-no-files-found: error
    - name: Run regression tests
      run: ctest --test-dir build-linux --output-on-failure

  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.scan_download_run_id == ''
    runs-on: windows-latest
    env:
      SIGN_WINDOWS: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_windows }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Validate code signing configuration
      if: env.SIGN_WINDOWS == 'true'
      env:
        SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if ($env:GITHUB_REPOSITORY -ne 'KerimDemirkaynak/assdraw' -or
            $env:GITHUB_REF -ne "refs/heads/$env:DEFAULT_BRANCH") {
          throw 'Signed builds must run from the default branch of KerimDemirkaynak/assdraw.'
        }
        foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing $name. Complete docs/windows-code-signing.md before requesting a signed build."
          }
        }
      shell: pwsh

    - name: Ensure AGG Submodule Exists (Fallback Clone)
      run: |
        if (-not (Test-Path "vendor/agg/agg-src/include/agg_basics.h")) {
            Write-Host "Alt modul eksik! Git submodules atlanarak manuel klonlaniyor..."
            if (Test-Path "vendor/agg") { Remove-Item -Recurse -Force "vendor/agg" }
            git clone https://github.com/ghaerr/agg-2.6.git vendor/agg
            Set-Location vendor/agg
            git checkout c4f36b4432142f22c0bf82c6fbdb41567a236be2
            Set-Location ../..
        }
      shell: pwsh

    - name: Build with PowerShell helper
      run: .\build\build-win-vcpkg.ps1 -Fresh
      shell: pwsh

    # Finish all builds before signing: a subsequent relink would remove the signature.
    - name: Build and run regression tests
      run: |
        cmake --build build-dir --config Release --target assdraw-core-tests assdraw-gui-tests --parallel
        if ($LASTEXITCODE -ne 0) { throw 'Test build failed.' }
        ctest --test-dir build-dir -C Release --output-on-failure
        if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
        .\tests\windows-signature-tests.ps1 -UnsignedExecutable 'build-dir\Release\assdraw3.exe'
      shell: pwsh

    - name: Upload application for signing
      if: env.SIGN_WINDOWS == 'true'
      id: signing-application
      uses: actions/upload-artifact@v7
      with:
        name: signing-input-application
        path: build-dir\Release\assdraw3.exe
        retention-days: 1
        if-no-files-found: error

    - name: Sign application
      if: env.SIGN_WINDOWS == 'true'
      uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: windows-application
        github-artifact-id: ${{ steps.signing-application.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 1800
        output-artifact-directory: ${{ runner.temp }}/signed-application

    - name: Verify and stage signed application
      if: env.SIGN_WINDOWS == 'true'
      run: |
        $signed = Join-Path $env:RUNNER_TEMP 'signed-application\assdraw3.exe'
        .\build\verify-windows-signature.ps1 -Path $signed
        Copy-Item -LiteralPath $signed -Destination 'build-dir\Release\assdraw3.exe' -Force
      shell: pwsh

    - name: Package Windows build
      run: |
        $package = 'package\ASSDraw3-Windows-x64'
        cmake --install build-dir --config Release --prefix $package
        if ($LASTEXITCODE -ne 0) { throw 'Application staging failed.' }
        Get-ChildItem 'build-dir\Release' -Filter '*.dll' | Copy-Item -Destination $package
        python tools/translations.py --check-package $package
        if ($LASTEXITCODE -ne 0) { throw 'Language or manual files are missing.' }
      shell: pwsh

    - name: Create portable ZIP
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'inno-setup'
      run: Compress-Archive -Path 'package\ASSDraw3-Windows-x64\*' -DestinationPath 'ASSDraw3-Windows-x64-Portable.zip' -Force
      shell: pwsh

    - name: Compile Inno Setup Installer
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'portable'
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
        if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
      shell: pwsh

    - name: Upload installer for signing
      if: env.SIGN_WINDOWS == 'true' && inputs.windows_package != 'portable'
      id: signing-installer
      uses: actions/upload-artifact@v7
      with:
        name: signing-input-installer
        path: installer\ASSDraw3-Windows-x64-Setup.exe
        retention-days: 1
        if-no-files-found: error

    - name: Sign installer
      if: env.SIGN_WINDOWS == 'true' && inputs.windows_package != 'portable'
      uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: windows-installer
        github-artifact-id: ${{ steps.signing-installer.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 1800
        output-artifact-directory: ${{ runner.temp }}/signed-installer

    - name: Verify and stage signed installer
      if: env.SIGN_WINDOWS == 'true' && inputs.windows_package != 'portable'
      run: |
        $signed = Join-Path $env:RUNNER_TEMP 'signed-installer\ASSDraw3-Windows-x64-Setup.exe'
        .\build\verify-windows-signature.ps1 -Path $signed
        $appSignature = Get-AuthenticodeSignature -FilePath 'build-dir\Release\assdraw3.exe'
        $setupSignature = Get-AuthenticodeSignature -FilePath $signed
        if ($appSignature.SignerCertificate.Thumbprint -ne $setupSignature.SignerCertificate.Thumbprint) {
          throw 'Application and installer must use the same signing certificate.'
        }
        Copy-Item -LiteralPath $signed -Destination 'installer\ASSDraw3-Windows-x64-Setup.exe' -Force
      shell: pwsh

    - name: Verify Windows installer
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'portable'
      run: |
        $install = Join-Path $env:RUNNER_TEMP 'assdraw-installed'
        $setup = Start-Process 'installer\ASSDraw3-Windows-x64-Setup.exe' -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$install`"" -Wait -PassThru
        if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
        if (-not (Test-Path "$install\bin\assdraw3.exe")) { throw 'Installed executable is missing.' }
        python tools/translations.py --check-package "$install\bin"
        if ($LASTEXITCODE -ne 0) { throw 'Installed resources are incomplete.' }
        if ($env:SIGN_WINDOWS -eq 'true') {
          .\build\verify-windows-signature.ps1 -Path "$install\bin\assdraw3.exe"
          if ((Get-FileHash "$install\bin\assdraw3.exe").Hash -ne
              (Get-FileHash 'build-dir\Release\assdraw3.exe').Hash) {
            throw 'The installer did not preserve the signed application.'
          }
        }
      shell: pwsh

    - name: Scan Windows packages with Microsoft Defender
      timeout-minutes: 15
      run: |
        $paths = @('package\ASSDraw3-Windows-x64')
        if (Test-Path 'ASSDraw3-Windows-x64-Portable.zip') { $paths += 'ASSDraw3-Windows-x64-Portable.zip' }
        if (Test-Path 'installer\ASSDraw3-Windows-x64-Setup.exe') { $paths += 'installer\ASSDraw3-Windows-x64-Setup.exe' }
        .\build\scan-windows-downloads.ps1 -Paths $paths -ReportPath "$env:RUNNER_TEMP\defender-report.txt"
      shell: pwsh

    - name: Upload antivirus scan report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-defender-report
        path: ${{ runner.temp }}/defender-report.txt
        if-no-files-found: ignore

    - name: Upload Windows build
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'inno-setup'
      uses: actions/upload-artifact@v7
      with:
        path: ASSDraw3-Windows-x64-Portable.zip
        archive: false
        if-no-files-found: error

    - name: Upload Windows Installer
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'portable'
      uses: actions/upload-artifact@v7
      with:
        path: installer\ASSDraw3-Windows-x64-Setup.exe
        archive: false
        if-no-files-found: error

    - name: Report Windows signing status
      run: |
        if ($env:SIGN_WINDOWS -eq 'true') {
          'Windows packages: timestamped Authenticode signatures verified.' >> $env:GITHUB_STEP_SUMMARY
        } else {
          'Windows packages: unsigned development build. See docs/windows-code-signing.md for signed builds.' >> $env:GITHUB_STEP_SUMMARY
        }
      shell: pwsh

  scan-reported-downloads:
    if: github.event_name == 'workflow_dispatch' && inputs.scan_download_run_id != ''
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Validate source run
      env:
        SOURCE_RUN_ID: ${{ inputs.scan_download_run_id }}
      run: |
        if ($env:SOURCE_RUN_ID -notmatch '^[0-9]+$') { throw 'Source run ID must be numeric.' }
      shell: pwsh

    - name: Download reported Windows packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        github-token: ${{ github.token }}
        run-id: ${{ inputs.scan_download_run_id }}
        pattern: ASSDraw3-Windows-x64-*
        merge-multiple: true
        skip-decompress: true
        path: ${{ runner.temp }}/reported-downloads

    - name: Scan original downloads without running them
      run: |
        $downloads = Join-Path $env:RUNNER_TEMP 'reported-downloads'
        $portable = Join-Path $downloads 'ASSDraw3-Windows-x64-Portable.zip'
        $installer = Join-Path $downloads 'ASSDraw3-Windows-x64-Setup.exe'
        if (-not (Test-Path $portable) -or -not (Test-Path $installer)) {
          throw 'Both original Windows packages are required for this investigation.'
        }
        Expand-Archive -LiteralPath $portable -DestinationPath (Join-Path $downloads 'portable')
        .\build\scan-windows-downloads.ps1 -Paths @($downloads) -ReportPath "$env:RUNNER_TEMP\reported-defender-report.txt"
      shell: pwsh

    - name: Upload investigation report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: reported-downloads-defender-report
        path: ${{ runner.temp }}/reported-defender-report.txt
        if-no-files-found: ignore
