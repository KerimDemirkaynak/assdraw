name: Build ASSDraw3

on:
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      windows_package:
        description: Windows download format
        type: choice
        default: both
        options:
          - both
          - inno-setup
          - portable

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwxgtk3.2-dev ninja-build xvfb gettext
    - name: Configure
      run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
    - name: Build editor and tests
      run: cmake --build build-linux --parallel 2
    - name: Package Linux build
      run: |
        cmake --install build-linux --prefix package/ASSDraw3-Linux-x64
        python3 tools/translations.py --check-package package/ASSDraw3-Linux-x64
        tar -C package -czf ASSDraw3-Linux-x64.tar.gz ASSDraw3-Linux-x64
    - name: Upload Linux build
      uses: actions/upload-artifact@v7
      with:
        path: ASSDraw3-Linux-x64.tar.gz
        archive: false
        if-no-files-found: error
    - name: Run regression tests
      run: ctest --test-dir build-linux --output-on-failure

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Ensure AGG Submodule Exists (Fallback Clone)
      run: |
        if (-not (Test-Path "vendor/agg/agg-src/include/agg_basics.h")) {
            Write-Host "Alt modul eksik! Git submodules atlanarak manuel klonlaniyor..."
            if (Test-Path "vendor/agg") { Remove-Item -Recurse -Force "vendor/agg" }
            git clone https://github.com/ghaerr/agg-2.6.git vendor/agg
            Set-Location vendor/agg
            git checkout c4f36b4432142f22c0bf82c6fbdb41567a236be2
            Set-Location ../..
        }
      shell: pwsh

    - name: Cache vcpkg archives
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\vcpkg\archives
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Set VCPKG_ROOT
      run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Build with PowerShell helper
      run: .\build\build-win-vcpkg.ps1 -Fresh
      shell: pwsh

    - name: Package Windows build
      run: |
        $package = 'package\ASSDraw3-Windows-x64'
        cmake --install build-dir --config Release --prefix $package
        if ($LASTEXITCODE -ne 0) { throw 'Application staging failed.' }
        Get-ChildItem 'build-dir\Release' -Filter '*.dll' | Copy-Item -Destination $package
        python tools/translations.py --check-package $package
        if ($LASTEXITCODE -ne 0) { throw 'Language or manual files are missing.' }
      shell: pwsh

    - name: Create portable ZIP
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'inno-setup'
      run: Compress-Archive -Path 'package\ASSDraw3-Windows-x64\*' -DestinationPath 'ASSDraw3-Windows-x64-Portable.zip' -Force
      shell: pwsh

    - name: Upload Windows build
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'inno-setup'
      uses: actions/upload-artifact@v7
      with:
        path: ASSDraw3-Windows-x64-Portable.zip
        archive: false
        if-no-files-found: error

    - name: Compile Inno Setup Installer
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'portable'
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
        if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
      shell: pwsh

    - name: Upload Windows Installer
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'portable'
      uses: actions/upload-artifact@v7
      with:
        path: installer\ASSDraw3-Windows-x64-Setup.exe
        archive: false
        if-no-files-found: error

    - name: Verify Windows installer
      if: github.event_name != 'workflow_dispatch' || inputs.windows_package != 'portable'
      run: |
        $install = Join-Path $env:RUNNER_TEMP 'assdraw-installed'
        $setup = Start-Process 'installer\ASSDraw3-Windows-x64-Setup.exe' -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$install`"" -Wait -PassThru
        if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
        if (-not (Test-Path "$install\bin\assdraw3.exe")) { throw 'Installed executable is missing.' }
        python tools/translations.py --check-package "$install\bin"
        if ($LASTEXITCODE -ne 0) { throw 'Installed resources are incomplete.' }
      shell: pwsh

    - name: Build and run regression tests
      run: |
        cmake --build build-dir --config Release --target assdraw-core-tests assdraw-gui-tests --parallel
        if ($LASTEXITCODE -ne 0) { throw 'Test build failed.' }
        ctest --test-dir build-dir -C Release --output-on-failure
        if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
      shell: pwsh
