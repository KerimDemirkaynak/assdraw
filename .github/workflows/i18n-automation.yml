name: Update translation catalogs

on:
  workflow_dispatch: # Sadece Actions sekmesinden manuel tetiklendiğinde çalışır

permissions:
  contents: write
  pull-requests: write

jobs:
  run-i18n-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install gettext (for xgettext, msgmerge)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Run i18n Automation Script
        run: |
          # Betiğin ana dizinde i18n_setup.py adıyla bulunduğunu varsayıyoruz
          python i18n_setup.py --update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update gettext translation catalogs"
          title: "Update translation catalogs"
          body: |
            Updates the gettext source template and merges existing translations.
            C++ source, language menus, CMake, and installer files are not rewritten.
            Complete any new translations before merging; CI validates all catalogs.
          branch: i18n-auto-update
          base: master # veya ana dalınızın adı main ise main olarak değiştirin
          labels: "i18n, automated pr"
