[package]
name = "assdraw-rs"
version = "0.3.0"
edition = "2021"
description = "Modern Rust rewrite of ASSDraw3 — ASS vector shape designer"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/KerimDemirkaynak/assdraw"
keywords = ["ass", "subtitle", "aegisub", "vector", "drawing"]
categories = ["graphics", "multimedia"]
rust-version = "1.82"
build = "build.rs"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", default-features = false, features = ["svg", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1"
dirs = "5"
lyon = "1.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = false
codegen-units = 16
opt-level = 3
strip = true

[lib]
name = "assdraw_rs"
path = "src/lib.rs"

[[bin]]
name = "assdraw-rs"
path = "src/main.rs"
